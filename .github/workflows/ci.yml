name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # Same seed, same world: wasm output must match native byte for byte.
  wasm-matches-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo install wasm-bindgen-cli --version 0.2.117 --locked
      - run: cargo build -p undercroft-cli
      - run: cargo build --profile wasm-release --target wasm32-unknown-unknown -p undercroft-wasm
      - run: wasm-bindgen --target nodejs --out-dir target/wasm-node target/wasm32-unknown-unknown/wasm-release/undercroft_wasm.wasm
      - run: node web/crosscheck.mjs "$PWD/target/wasm-node/undercroft_wasm.js" target/debug/croft
