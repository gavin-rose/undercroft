[package]
name = "undercroft-wasm"
description = "WebAssembly bindings for the undercroft generator"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
undercroft.workspace = true
undercroft-render = { path = "../undercroft-render" }
undercroft-sim = { path = "../undercroft-sim" }
serde_json = "1"
# Must match the installed wasm-bindgen CLI exactly (see web/build.sh).
wasm-bindgen = "=0.2.117"
